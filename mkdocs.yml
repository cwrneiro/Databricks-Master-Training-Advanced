site_name: Engenharia de Dados e IA no Databricks
site_description: Workshop hands-on de 1 dia, do evento de autorização ao app, com bundle, pipeline, Lakebase, agente e app

# URL pública do site (GitHub Pages, publicado pelo .github/workflows/docs.yml).
site_url: https://cwrneiro.github.io/Databricks-Master-Training-Advanced/

repo_url: https://github.com/cwrneiro/Databricks-Master-Training-Advanced
edit_uri: edit/main/

# Link no rodapé para o setup da turma (líder). Caminho absoluto a partir da
# raiz do site publicado.
copyright: '<a href="/Databricks-Master-Training-Advanced/00%20-%20Setup%20and%20teardown/">00 - Setup and teardown</a>'

# O repositório inteiro é a fonte da documentação (READMEs ficam intocados).
# Construído com o Zensical, que lê este mkdocs.yml. Ele exige o site_dir
# dentro do repo: site/ fica no .gitignore e no exclude_docs.
docs_dir: .
site_dir: site

# Fora do site: material interno do desenvolvimento, o node_modules do app e
# os arquivos do template do agente (são para o agentbricks, não para o aluno).
# As analogias.md são só da versão do cliente (mkdocs-cliente.yml, ADR-0004).
# O resto (.py, .yml, .sql) fica: são os arquivos companheiros dos READMEs.
exclude_docs: |
  requirements-docs.txt
  mkdocs.yml
  mkdocs-cliente.yml
  analogias.md
  CLAUDE.md
  CONTEXT.md
  /docs/
  node_modules/
  dist/
  __pycache__/
  /site/
  /01 - Pipeline e bundle/src/app/*.md
  /03 - Agente/agente/*.md

# classic: o visual do Material for MkDocs (header lava red com o logo
# branco). O padrão do Zensical (modern) tem header neutro.
theme:
  name: material
  variant: classic
  language: pt-BR
  logo: assets/databricks-lockup-white.svg
  favicon: assets/databricks-symbol.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

# Paleta de cores Databricks (lava red) aplicada via CSS.
extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  # Blocos ```mermaid viram diagramas (o GitHub renderiza os mesmos blocos).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Páginas fora do menu lateral. "00 - Setup and teardown" é do líder: fica acessível
# pelo rodapé e pela home. As perguntas do agente são de apoio dos módulos 3 e 4.
not_in_nav: |
  00 - Setup and teardown/README.md
  03 - Agente/perguntas.md

nav:
  - Início: README.md
  - 01 - Pipeline e bundle: "01 - Pipeline e bundle/README.md"
  - 02 - Lakebase: "02 - Lakebase/README.md"
  - 03 - Agente: "03 - Agente/README.md"
  - 04 - App: "04 - App/README.md"
  - 05 - Fechamento: "05 - Fechamento/README.md"
