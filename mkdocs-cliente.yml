# Versão do cliente (ADR-0004): os módulos 01 e 02 do site principal + a
# página analogias.md do módulo 01. Sem Início nem módulos 03–05. Publicada em
# /compared/ pelo .github/workflows/docs.yml, que gera um index.html na raiz
# redirecionando para o módulo 01.
# Build local: `zensical build && zensical build -f mkdocs-cliente.yml`, nessa
# ordem (o build principal limpa o site/ inteiro, inclusive site/compared).
INHERIT: mkdocs-base.yml

# O INHERIT funde dicionários e concatena listas; strings daqui substituem
# as do mkdocs-base.yml. Por isso exclude_docs e copyright são repetidos inteiros.
site_url: https://cwrneiro.github.io/Databricks-Master-Training-Advanced/compared/
site_dir: site/compared

copyright: '<a href="/Databricks-Master-Training-Advanced/compared/00%20-%20Setup%20and%20teardown/">00 - Setup and teardown</a>'

# O mesmo do mkdocs-base.yml, sem analogias.md e mais o Início e os módulos 03–05.
exclude_docs: |
  /README.md
  /03 - Agente/
  /04 - App/
  /05 - Fechamento/
  requirements-docs.txt
  mkdocs.yml
  mkdocs-base.yml
  mkdocs-cliente.yml
  CLAUDE.md
  CONTEXT.md
  /docs/
  node_modules/
  dist/
  __pycache__/
  /site/
  /01 - Pipeline e bundle/src/app/*.md

nav:
  - 01 - Pipeline e bundle:
      - "01 - Pipeline e bundle/README.md"
      - "01 - Pipeline e bundle/1.1 - Deploy do bundle.md"
      - "01 - Pipeline e bundle/1.2 - Job e pipeline.md"
      - Analogias: "01 - Pipeline e bundle/analogias.md"
  - 02 - Lakebase:
      - "02 - Lakebase/README.md"
      - "02 - Lakebase/2.1 - Synced table no bundle.md"
      - "02 - Lakebase/2.2 - Populando a base.md"
